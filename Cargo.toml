[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/tessaridb/tessaridb-s3-client"
homepage = "https://github.com/tessaridb/tessaridb-s3-client"

[workspace.dependencies]
thiserror = "2"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tessaridb-s3-client = { path = "crates/tessaridb-s3-client", version = "0.0.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
unwrap_used = "deny"
panic = "deny"
expect_used = "deny"
arithmetic_side_effects = "deny"
todo = "warn"
unimplemented = "warn"
