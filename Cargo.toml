[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["boogvar"]
repository = "https://github.com/tessaridb/tessaridb-s3-client"
homepage = "https://github.com/tessaridb/tessaridb-s3-client"

[workspace.dependencies]
thiserror = "2"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
bytes = "1"
crc-fast = "1"
fastrand = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
md-5 = "0.10"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
tokio = { version = "1", features = ["time", "fs", "io-util", "rt"] }
tokio-util = { version = "0.7", features = ["io"] }
tempfile = "3"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
tessaridb-s3-client = { path = "crates/tessaridb-s3-client", version = "0.2.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
unwrap_used = "deny"
panic = "deny"
expect_used = "deny"
arithmetic_side_effects = "deny"
todo = "warn"
unimplemented = "warn"
